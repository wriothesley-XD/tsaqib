<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>TSAQIB — Floating Island Landing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F5EF;
    --ink:#10140F;
    --gold:#C9A66B;
    --font-display:'Plus Jakarta Sans', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-label:'Manrope', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#DCEBF2;}
  body{
    font-family:var(--font-body);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
  }

  /* ===== Scene container keeps the 2560x1440 art's exact proportions ===== */
  .scene{
    position:relative;
    width:100%;
    max-width:2560px;
    aspect-ratio: 2560 / 1440;
    margin:auto;
    overflow:hidden;
  }

  .layer{
    position:absolute;
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
  }
  /* every element is placed with its real bounding box from the source canvas,
     expressed as % so it scales perfectly at any viewport size */
  .l-sky              { left:0%;      top:0%;      width:100%;    height:100%; }
  .l-clouds-far        { left:22.852%; top:0%;      width:77.148%; height:100%; }
  .l-clouds-near       { left:3.828%;  top:41.458%; width:43.477%; height:50.972%; }
  .l-clouds-mist       { left:0%;      top:65.486%; width:100%;    height:34.514%; }
  .l-building-a        { left:0%;      top:36.667%; width:23.086%; height:63.333%; }
  .l-buildings-b       { left:0%;      top:0%;      width:98.984%; height:90.486%; }
  .l-building-c        { left:26.641%; top:7.431%;  width:30.391%; height:79.792%; }
  .l-main-island       { left:10.625%; top:0%;      width:87.578%; height:100%; }
  .l-mosque-decor      { left:0%;      top:0%;      width:83.594%; height:84.653%; }
  .l-foreground-decor  { left:18.242%; top:32.222%; width:50.078%; height:46.597%; }

  /* ===== entrance: every element rises slightly + fades in ===== */
  .enter{
    opacity:0;
    transform:translateY(14px);
    animation:riseIn .9s cubic-bezier(.22,.8,.3,1) forwards;
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ===== background static layers (each gets its own entrance delay) ===== */
  .l-sky          { animation-delay: 0s; }
  .l-clouds-far   { animation-delay: .15s; }
  .l-clouds-near  { animation-delay: .25s; }
  .l-clouds-mist  { animation-delay: .3s; }
  .l-building-a   { animation-delay: .4s; }
  .l-buildings-b  { animation-delay: .48s; }
  .l-building-c   { animation-delay: .56s; }

  /* ===== the island group: base + mosque/decor + foreground decor
     move TOGETHER so nothing detaches from the island ===== */
  .island-float{
    position:absolute;
    inset:0;
    animation: floatIsland 6.5s ease-in-out 2s infinite;
  }
  @keyframes floatIsland{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-10px); } /* pelan & pendek */
  }

  .island-group{ position:absolute; inset:0; }
  .l-main-island      { animation-delay: .7s; }
  .l-mosque-decor     { animation-delay: .85s; }
  .l-foreground-decor { animation-delay: 1s; }

  /* ===== mosque click hotspot (invisible, positioned over the dome) ===== */
  .mosque-hotspot{
    position:absolute;
    left:37.11%;
    top:10.42%;
    width:18.75%;
    height:59.03%;
    cursor:pointer;
    opacity:0;
    animation: fadeInHotspot .6s ease 1.6s forwards;
  }
  @keyframes fadeInHotspot{ to{ opacity:1; } }
  .mosque-hotspot:hover{ filter:drop-shadow(0 0 22px rgba(201,166,107,.6)); }
  .mosque-hotspot:hover ~ .hotspot-tooltip,
  .mosque-hotspot:hover + .hotspot-tooltip{ opacity:1; transform:translate(-50%, -4px); }

  .hotspot-tooltip{
    position:absolute;
    left:46.49%;
    top:7%;
    transform:translate(-50%, 4px);
    background:var(--ink);
    color:var(--cream);
    font-family:var(--font-label);
    font-size:clamp(9px, 1.1vw, 13px);
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:6px 12px;
    border-radius:7px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:5;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>

<div class="scene">

  <img class="layer l-sky enter" src="assets/sky.png" alt="">
  <img class="layer l-clouds-far enter" src="assets/clouds-far.png" alt="">
  <img class="layer l-clouds-near enter" src="assets/clouds-near.png" alt="">
  <img class="layer l-clouds-mist enter" src="assets/clouds-mist.png" alt="">

  <img class="layer l-building-a enter" src="assets/building-a.png" alt="">
  <img class="layer l-buildings-b enter" src="assets/buildings-b.png" alt="">
  <img class="layer l-building-c enter" src="assets/building-c.png" alt="">

  <!-- island + everything on it floats together, pelan & pendek -->
  <div class="island-float">
    <div class="island-group">
      <img class="layer l-main-island enter" src="assets/main-island.png" alt="Pulau utama TSAQIB">
      <img class="layer l-mosque-decor enter" src="assets/mosque-decor.png" alt="Masjid, perpustakaan mini, dan dekorasi">
      <img class="layer l-foreground-decor enter" src="assets/foreground-decor.png" alt="">

      <!-- data-route: ganti onclick ini dengan window.location = "{{ route('komunitas.index') }}" di Blade -->
      <div class="mosque-hotspot" onclick="window.alert('→ Masuk ke Komunitas / TSAQIB')" title="Masuk ke TSAQIB"></div>
      <div class="hotspot-tooltip">Masuk ke TSAQIB</div>
    </div>
  </div>

</div>

</body>
</html>
